# External git repos pulled in as part of dotfiles2.
#
# chezmoi clones these on `chezmoi apply` and `git pull`s them on
# `chezmoi update` (or once refreshPeriod elapses). They stay independent
# repos: edit and `git push` directly from the target directory.
#
#   .config/tmux             -> codr1/tmux-codr1   (tmux config)
#   .config/tmux/plugins/tpm -> tmux-plugins/tpm   (tmux plugin manager; dep)
#   .config/nvim             -> codr1/nvim-codr1   (neovim config)

[".config/tmux"]
    type = "git-repo"
    url = "https://github.com/codr1/tmux-codr1.git"
    refreshPeriod = "168h"

[".config/tmux/plugins/tpm"]
    type = "git-repo"
    url = "https://github.com/tmux-plugins/tpm.git"
    refreshPeriod = "168h"

[".config/nvim"]
    type = "git-repo"
    url = "https://github.com/codr1/nvim-codr1.git"
    refreshPeriod = "168h"
